name: Build ProCosmetics

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Spigot cache (BuildTools output)
        id: spigot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-26.1.2-26.2-26.3-v1

      - name: Build Spigot 26.1.2 / 26.2 / 26.3 with BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildtools && cd buildtools
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          for v in 26.1.2 26.2 26.3; do
            java -jar BuildTools.jar --rev "$v" --remapped
          done

      - name: Save Spigot cache
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-26.1.2-26.2-26.3-v1

      - name: Dump particle API (temporary)
        run: |
          for v in 26.1.2 26.2 26.3; do
            echo "=== $v ==="
            api=~/.m2/repository/org/spigotmc/spigot-api/$v-R0.1-SNAPSHOT/spigot-api-$v-R0.1-SNAPSHOT.jar
            javap -cp "$api" org.bukkit.Particle | grep 'public static final' | sed 's/.*Particle //' | tr '\n' ' '; echo
            unzip -l "$api" | grep -i particle | awk '{print $4}'
          done
          v=26.3
          srv=$(ls ~/.m2/repository/org/spigotmc/spigot/$v-R0.1-SNAPSHOT/*remapped-mojang.jar | head -1)
          echo "server jar: $srv"
          unzip -l "$srv" | grep 'net/minecraft/core/particles/' | awk '{print $4}'
          api=~/.m2/repository/org/spigotmc/spigot-api/$v-R0.1-SNAPSHOT/spigot-api-$v-R0.1-SNAPSHOT.jar
          for c in $(unzip -l "$api" | grep -i 'org/bukkit/.*particle.*\.class' | awk '{print $4}' | sed 's/\.class$//; s|/|.|g'); do javap -cp "$api" "$c"; done
          javap -cp "$api" org.bukkit.Particle
        continue-on-error: true

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -PreposiliteUsername=dummy -PreposiliteToken=dummy

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ProCosmetics
          path: build/libs/ProCosmetics-*.jar
