name: Build KiwiCosmetics

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Spigot cache (BuildTools output)
        id: spigot-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository/org/spigotmc
            ~/.m2/repository/com/mojang
          key: spigot-26.1.2-26.2-26.3-v2

      - name: Build Spigot 26.1.2 / 26.2 / 26.3 with BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p buildtools && cd buildtools
          curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          for v in 26.1.2 26.2 26.3; do
            java -jar BuildTools.jar --rev "$v" --remapped
          done

      - name: Save Spigot cache
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository/org/spigotmc
            ~/.m2/repository/com/mojang
          key: spigot-26.1.2-26.2-26.3-v2

      - name: Probe mannequin API (temporary)
        continue-on-error: true
        run: |
          api=~/.m2/repository/org/spigotmc/spigot-api/26.3-R0.1-SNAPSHOT/spigot-api-26.3-R0.1-SNAPSHOT.jar
          echo "=== spigot classes"; unzip -l "$api" | grep -iE "mannequin|ResolvableProfile|PlayerProfile|MainHand" | awk '{print $4}'
          for c in org.bukkit.entity.Mannequin org.bukkit.profile.PlayerProfile; do javap -cp "$api" "$c" || true; done
          javap -cp "$api" org.bukkit.entity.EntityType | grep -iE "MANNEQUIN|ARMOR_STAND|ITEM_DISPLAY" || true
          javap -cp "$api" org.bukkit.attribute.Attribute | grep -i "SCALE" || true
          echo "=== paper"
          jar=$(find ~/.gradle -name 'paper-api-26.2*.jar' 2>/dev/null | grep -v sources | head -1); echo "$jar"
          [ -n "$jar" ] && { unzip -l "$jar" | grep -iE "mannequin|ResolvableProfile" | awk '{print $4}'; javap -cp "$jar" org.bukkit.entity.Mannequin; javap -cp "$jar" io.papermc.paper.datacomponent.item.ResolvableProfile; } || true

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Probe paper mannequin API (temporary)
        continue-on-error: true
        run: |
          find ~/.gradle /home/runner/work -name '*.jar' 2>/dev/null | grep -iE "paper-api|paper.*dev|mojang-mapped|userdev" | head -20
          for jar in $(find ~/.gradle /home/runner/work -name '*.jar' 2>/dev/null | grep -iE "paper-api" | grep -v sources | head -3); do
            echo "== $jar"; unzip -l "$jar" | grep -iE "entity/Mannequin|ResolvableProfile" | awk '{print $4}'
            javap -cp "$jar" org.bukkit.entity.Mannequin || true
            javap -cp "$jar" io.papermc.paper.datacomponent.item.ResolvableProfile || true
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: KiwiCosmetics
          path: build/libs/KiwiCosmetics-*.jar

  # Starts a real Paper server with the plugin, runs a few commands and fails on plugin errors.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.3']
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download plugin
        uses: actions/download-artifact@v4
        with:
          name: KiwiCosmetics
          path: server/plugins

      - name: Download Paper ${{ matrix.minecraft }}
        working-directory: server
        run: |
          url=$(curl -fsSL "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.minecraft }}/builds/latest" | jq -r '.downloads["server:default"].url')
          echo "Paper: $url"
          curl -fsSL -o paper.jar "$url"
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > server.properties

      - name: Run server
        working-directory: server
        run: |
          mkfifo console
          (sleep 600; echo stop) > /dev/null &
          tail -f console | timeout 600 java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          exec 3> console
          until grep -q 'Done (' server.log; do
            if ! pgrep -f paper.jar > /dev/null; then echo "Server died"; cat server.log; exit 1; fi
            sleep 2
          done
          for command in "kiwicosmetics" "kc permission trails" "kc permission particle_effects" "hats list" "rainbow list" "kc reload" "hats reload"; do
            echo "$command" >&3
            sleep 3
          done
          echo "stop" >&3
          for i in $(seq 1 60); do pgrep -f paper.jar > /dev/null || break; sleep 2; done
          cat server.log

      - name: Check for plugin errors
        working-directory: server
        run: |
          echo "---- everything after startup (command output) ----"
          sed -n '/Done (/,$p' server.log
          echo "----"
          if ! grep -q "\[KiwiCosmetics\] Initialized!" server.log; then
            echo "::error::KiwiCosmetics did not enable"; exit 1
          fi
          # Stack traces through plugin code, unknown translations and broken config items
          if grep -nE "^\s*at me\.dtbh\.kiwicosmetics|Unknown string|Failed to parse item|Error occurred while (enabling|disabling) KiwiCosmetics" server.log; then
            grep -nE -B30 "^\s*at me\.dtbh\.kiwicosmetics" server.log | head -200
            echo "::error::KiwiCosmetics logged errors (see above)"; exit 1
          fi
          if grep -nE "(ERROR|WARN)\]: \[KiwiCosmetics\]" server.log | grep -v "need Paper"; then
            echo "::warning::KiwiCosmetics logged warnings (see above)"
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.minecraft }}
          path: server/server.log
