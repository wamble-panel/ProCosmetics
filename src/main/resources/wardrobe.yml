# KiwiCosmetics wardrobe: animated rainbow leather armor + hat/rainbow messages.
# Hats themselves are in hats.yml. Both need a Paper server.
#
# Text supports MiniMessage (<#FFC8DD>, <bold>, <gradient:#FFB5A7:#FFC8DD>) and legacy codes (&a, &#ff7b00).

settings:
  # How often (in ticks) each player's armor is checked for rainbow pieces.
  # Lower = new armor starts animating faster, higher = less work for the server.
  # 10 ticks = half a second. Leave this alone unless you know you need it.
  scan-interval: 10

particles:
  enabled: true
  # Which worn piece emits the particles: helmet, chestplate, leggings or boots.
  piece: boots
  count: 10
  # Dust particle size (1.0 is the vanilla redstone size).
  size: 1.0
  # Random spread around the player's feet, in blocks.
  offset: 0.2
  # Only players within this many blocks will see the particles.
  view-distance: 32
  # Don't show particles for spectators or players with the invisibility effect.
  hide-for-spectators: true
  hide-when-invisible: true

patterns:
  basic:
    colors:
      - '#ff7b00'
      - '#000000'
      - '#FFFFFF'
    # How many colors are generated between each pair above. More = smoother.
    amount-of-colors: 7
    # How often the color changes. 20 = once per second,
    # 10 = every half second, 2 = every tenth of a second.
    interval: 10
    # true  = after the last color, fade back into the first one.
    # false = jump straight from the last color back to the first.
    smooth-loop: true
    items:
      helmet:
        name: '&aRainbow helmet'
        lore:
          - '<#8A8A8A>✦ <#CDB4DB>ʀᴀɪɴʙᴏᴡ ᴀʀᴍᴏʀ'
          - ''
          - '<#B5EAD7>✔ <#FFD8BE>ᴜɴʙʀᴇᴀᴋᴀʙʟᴇ'
      chestplate:
        name: '&aRainbow chestplate'
        lore:
          - '<#8A8A8A>✦ <#CDB4DB>ʀᴀɪɴʙᴏᴡ ᴀʀᴍᴏʀ'
          - ''
          - '<#B5EAD7>✔ <#FFD8BE>ᴜɴʙʀᴇᴀᴋᴀʙʟᴇ'
      leggings:
        name: '&aRainbow leggings'
        lore:
          - '<#8A8A8A>✦ <#CDB4DB>ʀᴀɪɴʙᴏᴡ ᴀʀᴍᴏʀ'
          - ''
          - '<#B5EAD7>✔ <#FFD8BE>ᴜɴʙʀᴇᴀᴋᴀʙʟᴇ'
      boots:
        name: '&aRainbow boots'
        lore:
          - '<#8A8A8A>✦ <#CDB4DB>ʀᴀɪɴʙᴏᴡ ᴀʀᴍᴏʀ'
          - ''
          - '<#B5EAD7>✔ <#FFD8BE>ᴜɴʙʀᴇᴀᴋᴀʙʟᴇ'
  halloween:
    colors:
      - '#54d06b'
      - '#321fdb'
    amount-of-colors: 10
    interval: 5
    smooth-loop: true
    items:
      helmet:
        name: '&aRainbow helmet'
        lore:
          - '<#8A8A8A>✦ <#CDB4DB>ʀᴀɪɴʙᴏᴡ ᴀʀᴍᴏʀ'
          - ''
          - '<#B5EAD7>✔ <#FFD8BE>ᴜɴʙʀᴇᴀᴋᴀʙʟᴇ'
      chestplate:
        name: '&aRainbow chestplate'
        lore:
          - '<#8A8A8A>✦ <#CDB4DB>ʀᴀɪɴʙᴏᴡ ᴀʀᴍᴏʀ'
          - ''
          - '<#B5EAD7>✔ <#FFD8BE>ᴜɴʙʀᴇᴀᴋᴀʙʟᴇ'
