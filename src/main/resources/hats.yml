# KiwiCosmetics hats
#
# Converted from the old ExecutableItems hats. The ids (crown, apple_hat, ...) are the same as the
# ExecutableItems file names, which is how old hats are recognized and upgraded automatically.
#
# Hats work like real helmets: right-click into the air, shift-click or drag them into the
# head slot. They can't be placed, eaten, composted or fed to animals, and are unbreakable.
#
# Easiest way to add one in-game: /hats create <material> [name]
#
# Per hat:
#   material      the item type
#   name / lore   MiniMessage (<#FFC8DD>, <bold>, <gradient:#FFB5A7:#FFC8DD>...) or legacy (&a, &#ff7b00, #ff7b00)
#   glow          enchantment shine (default false)
#   head-texture  base64 skin texture, only for PLAYER_HEAD
#   wearable      false = just a collectible, can't be worn (default true)
#   commands      console commands run when the hat is put on, %player% = player name

settings:
  # Recognize old ExecutableItems hats by type + name when their id tag can't be read.
  # Only applies to items that still carry ExecutableItems data, so renamed items never count.
  match-by-name: true

