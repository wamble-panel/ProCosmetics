#
# Cosmetics are unlocked with permissions only:
#   kiwicosmetics.cosmetic.*                      every cosmetic
#   kiwicosmetics.cosmetic.<category>.*           a whole category (e.g. kiwicosmetics.cosmetic.trails.*)
#   kiwicosmetics.cosmetic.<category>.<cosmetic>  one cosmetic (e.g. kiwicosmetics.cosmetic.particle_effects.angel_wings)
# Use /kiwicosmetics permission <category> in-game to see (and copy) every permission of a category.
#
# Players open the menu with /cosmetics, or a category directly with /cosmetics <category>.
# Hats and rainbow armor are configured in hats.yml and wardrobe.yml (Paper only).

multi_world:
  # Setting this to false will invert the feature to whitelisted-worlds.
  blacklisted_worlds: true
  worlds:
    - world_no_cosmetics
    - world_example

# World Guard Support
world_guard:
  enabled: true
  # This feature allows players to automatically equip their previous cosmetics
  # when they leave a restricted region where cosmetics are disabled.
  restore_cosmetics: true

settings:
  # Sets the default language used in the plugin.
  default_language: "en_US"

  # Saves players' last equipped cosmetics to automatically re-equip them upon their next login.
  # This is stored on the player itself, no database needed.
  restore_cosmetics: true

  # Maximum distance (in blocks) at which players can see packet-based entities.
  entity_tracking_range: 48.0

# Items use vanilla Minecraft format for flexible customization.
# Supports resource packs and custom data components, for example:
#   minecraft:stone[minecraft:custom_model_data={floats:[0.0f]}]
# For more information: https://minecraft.wiki/w/Data_component_format
menu:
  # Frame around the menus.
  border:
    item: "minecraft:pink_stained_glass_pane[tooltip_display={hide_tooltip:true}]"
    count: 1
  # Every other empty slot. Remove this section to leave them empty.
  filler:
    item: "minecraft:white_stained_glass_pane[tooltip_display={hide_tooltip:true}]"
    count: 1

  # The menu /cosmetics opens.
  main:
    rows: 5
    header:
      item: "minecraft:player_head"
      count: 1
      slot: 4
    unequip_all:
      item: "minecraft:barrier"
      count: 1
      slot: 39
    close:
      item: "minecraft:oak_door"
      count: 1
      slot: 41
    # One tile per category. Remove a category here to hide it from the menu.
    categories:
      particle_effects:
        item: "minecraft:nether_star[!minecraft:rarity]"
        count: 1
        slot: 11
      trails:
        item: "minecraft:blaze_powder"
        count: 1
        slot: 12
      gadgets:
        item: "minecraft:piston"
        count: 1
        slot: 13
      hats:
        item: "minecraft:carved_pumpkin"
        count: 1
        slot: 14
      balloons:
        item: "minecraft:lead"
        count: 1
        slot: 15
      banners:
        item: "minecraft:pink_banner"
        count: 1
        slot: 20
      miniatures:
        item: "minecraft:zombie_head[!minecraft:rarity]"
        count: 1
        slot: 21
      arrow_effects:
        item: "minecraft:tipped_arrow[!minecraft:potion_contents]"
        count: 1
        slot: 22
      death_effects:
        item: "minecraft:skeleton_skull[!minecraft:rarity]"
        count: 1
        slot: 23
      music:
        item: "minecraft:music_disc_mall[!minecraft:jukebox_playable, !minecraft:rarity]"
        count: 1
        slot: 24

  # Every category menu (particles, trails, gadgets...) shares this layout.
  category:
    rows: 6
    header_slot: 4
    back:
      item: "minecraft:arrow"
      count: 1
      slot: 45
    previous_page:
      item: "minecraft:spectral_arrow"
      count: 1
      slot: 48
    unequip:
      item: "minecraft:barrier"
      count: 1
      slot: 49
    next_page:
      item: "minecraft:spectral_arrow"
      count: 1
      slot: 50
    sort:
      item: "minecraft:hopper"
      count: 1
      slot: 53
    # Shown instead of the cosmetic's own item while it is locked. Remove this section to show the real item.
    locked:
      item: "minecraft:gray_dye"
      count: 1

# Do not edit this!
config_version: 2
