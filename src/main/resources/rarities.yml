#
# Rarities represent how special a cosmetic item is, such as common, rare, or legendary.
#
# Rarities are shown in the cosmetics menu and color the cosmetic names there.
#
# You can customize existing rarities and add new ones as needed.
# IMPORTANT:
# If you rename a default rarity (e.g., "common"), remember to update all references to it in the cosmetics config files.
# Use the replace-all function to simplify this process.
#
# FIREWORK TYPES: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/FireworkEffect.Type.html

rarities:
  common:
    enabled: true
    priority: 1
    colors:
      primary: "#D9D9D9"
      secondary: "#A6A6A6"
    firework:
      detonations: 0
      tick_interval: 3
      type: BURST
      color: 999999
      fade: 555555
      flicker: false
      trail: false
  uncommon:
    enabled: true
    priority: 10
    colors:
      primary: "#B5EAD7"
      secondary: "#8FD3BA"
    firework:
      detonations: 1
      tick_interval: 3
      type: BURST
      color: "#33ff33"
      fade: "#00b300"
      flicker: false
      trail: false
  rare:
    enabled: true
    priority: 20
    colors:
      primary: "#A2D2FF"
      secondary: "#7FB8F0"
    firework:
      detonations: 4
      tick_interval: 3
      type: BURST
      color: "#1ad1ff"
      fade: "#008fb3"
      flicker: false
      trail: false
  epic:
    enabled: true
    priority: 30
    colors:
      primary: "#CDB4DB"
      secondary: "#B391C7"
    firework:
      detonations: 4
      tick_interval: 3
      type: BALL
      color: "#ff80ff"
      fade: "#cc00cc"
      flicker: false
      trail: true
  legendary:
    enabled: true
    priority: 40
    colors:
      primary: "#FFD6A5"
      secondary: "#FFB870"
    firework:
      detonations: 5
      tick_interval: 10
      type: BALL_LARGE
      color: "#e6b800"
      fade: "#ff9900"
      flicker: false
      trail: true
  limited:
    enabled: true
    priority: 50
    colors:
      primary: "#FFC8DD"
      secondary: "#FF9AA2"
    firework:
      detonations: 10
      tick_interval: 10
      type: BALL_LARGE
      color: "#e600e6"
      fade: "#b300b3"
      flicker: true
      trail: true

# Do not edit this!
config_version: 2