# Block trails: the ground you walk on turns into other blocks for a few seconds.
# The blocks are fake (only shown to players, the world never changes) and special blocks like
# chests, doors, beds and redstone are never touched.
#
# Enable/disable this entire category.
# When disabled, players cannot equip any cosmetics from this category as they will NOT be loaded into cache.
enabled: true

# Pause the trail while holding sneak.
sneak_to_pause: false

# How long each trail block stays before it turns back, in ticks (20 = 1 second).
block_duration_ticks: 60

cosmetics:
